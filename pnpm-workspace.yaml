allowBuilds:
  '@nestjs/core': true
  '@scarf/scarf': true
  '@swc/core': true
  argon2: true
  esbuild: true
  sharp: true
  unrs-resolver: true

packages:
  - apps/*
  - packages/*

# Versions shared by several packages live here so they can never drift apart.
catalog:
  '@types/node': ^22.20.5
  '@tanstack/react-query': ^5.107.1
  prettier: ^3.9.10
  typescript: ^6.0.3
  zod: ^4.6.7
